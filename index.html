<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover local people and potential matches. 18+ only.">
  <title>Explore Local Profiles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cookie&family=Oregano&family=Satisfy&display=swap"
    rel="stylesheet"
  >

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 25%;
      min-height: 0;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.50);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      overflow: hidden;
    }

    .description {
      max-width: 500px;
      margin: 0;
      font-family: "Satisfy", cursive;
      font-size: clamp(16.5px, 5.2vw, 30px);
      line-height: 1.35;
      font-weight: 400;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .description strong {
      font-family: "Satisfy", cursive;
      font-weight: 400;
      color: #fff;
    }

    .cta {
      display: block;
      width: min(80%, 330px);
      margin: 15px auto 0;
      padding: 8px 12px;
      background: #f58220;
      color: #fff;
      text-decoration: none;
      font-family: "Oregano", cursive;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: 0.1px;
      border-radius: 12px;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.35),
        0 6px 16px rgba(245, 130, 32, 0.30);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
      flex-shrink: 0;
    }

    .cta:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .cta:active {
      transform: translateY(0);
    }

    @media (max-height: 650px) {
      .card {
        height: 25%;
        padding: 14px 18px;
      }

      .description {
        font-size: 16.5px;
        line-height: 1.35;
      }

      .cta {
        margin: 12px 0 0;
        padding: 8px 12px;
        font-size: 17px;
      }
    }

    @media (min-width: 768px) {
      .card {
        height: 25%;
        padding-left: 40px;
        padding-right: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <img
      src="img.jpeg"
      alt="Dating profile"
      class="hero-image"
    >

    <section class="card">
      <div class="description">
        Still single? 😍 Meet 18+ singles nearby and find your match—100% free! 🥰
      </div>

      <a
        href="https://cutt.ly/6ymAQaec"
        class="cta"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join Now &amp; Start Chatting 👉
      </a>
    </section>
  </main>
</body>
</html>
